<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Hermit: AI that helps with your paperwork without ever seeing your paperwork. Chat with your documents entirely on your own device."
    />
    <title>Hermit: AI for your documents, entirely on your device</title>
    <script>
      // Runs before React mounts so the model-loaded flag can't flash. Reads
      // only a local flag; does not itself contact any server.
      try {
        if (localStorage.getItem('hermit_theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch {
        /* localStorage unavailable (private mode): default theme applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
